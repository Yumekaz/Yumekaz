<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Yumekaz — Open Workshop</title>
  <desc id="desc">Mihir Swarnkar. Building systems. Following the failure. A warm paper poster with cobalt blue construction lines and a geometric Y.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#17213A" stroke-opacity=".035"/>
    </pattern>
    <pattern id="blue-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/>
    </pattern>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1200" height="480" rx="8" fill="#F4F2EC"/>
  <rect width="1200" height="480" rx="8" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="479" rx="8"
        fill="none" stroke="#17213A" stroke-opacity=".12"/>

  <g class="mono" font-size="15" letter-spacing="1.2" fill="#17213A">
    <text x="52" y="54">MIHIR SWARNKAR / YUMEKAZ</text>
    <text x="1148" y="54" text-anchor="end">AN OPEN WORKSHOP</text>
  </g>
  <path d="M52 78H1148" stroke="#17213A" stroke-opacity=".22"/>

  <text x="46" y="211" class="sans" font-size="120"
        font-weight="700" letter-spacing="-7" fill="#17213A">Yumekaz<tspan fill="#254BE9">.</tspan></text>

  <g class="sans" font-size="38" letter-spacing="-1" fill="#17213A">
    <text x="52" y="276">Building systems.</text>
    <text x="52" y="324" fill="#586176">Following the failure.</text>
  </g>

  <g class="mono" font-size="15" letter-spacing="1.1" fill="#586176">
    <text x="52" y="383">SOFTWARE / SYSTEMS / EXPERIMENTS</text>
  </g>

  <g transform="rotate(-6 979 258)">
    <rect x="828" y="140" width="320" height="254" fill="#D9EF83"/>
    <rect x="814" y="126" width="320" height="254" fill="#254BE9"/>
    <rect x="814" y="126" width="320" height="254" fill="url(#blue-grid)"/>

    <text x="832" y="151" class="mono" font-size="11"
          letter-spacing="1.5" fill="#F4F2EC">FIG. 01 / CONNECTION</text>

    <path d="M866 188L974 253L1082 188M974 253V335"
          fill="none" stroke="#F4F2EC" stroke-width="15"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M866 188V335H1082V188"
          fill="none" stroke="#F4F2EC"
          stroke-opacity=".4" stroke-dasharray="3 7"/>

    <g fill="#D9EF83" stroke="#254BE9" stroke-width="5">
      <circle cx="866" cy="188" r="12"/>
      <circle cx="1082" cy="188" r="12"/>
      <circle cx="974" cy="335" r="12"/>
    </g>

    <circle cx="974" cy="253" r="19"
            fill="#254BE9" stroke="#F4F2EC" stroke-width="2"/>
    <circle cx="974" cy="253" r="6" fill="#D9EF83"/>

    <g class="mono" font-size="10" fill="#F4F2EC" letter-spacing="1">
      <text x="832" y="363">EXPLORE</text>
      <text x="1116" y="363" text-anchor="end">UNDERSTAND</text>
    </g>
  </g>

  <path d="M52 419H1148" stroke="#17213A" stroke-opacity=".22"/>
  <circle cx="60" cy="448" r="7" fill="#254BE9"/>

  <text x="81" y="453" class="mono" font-size="13"
        letter-spacing="1" fill="#17213A">CURIOUS BY NATURE. PRECISE BY PRACTICE.</text>

  <text x="1148" y="453" text-anchor="end" class="mono"
        font-size="13" letter-spacing="1"
        fill="#586176">SOURCE / NOTES / EXPERIMENTS</text>
</svg>
