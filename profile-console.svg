<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mihir Swarnkar distributed backend systems profile</title>
  <desc id="desc">A dark systems console showing replication, consistency, recovery, and evidence metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#111b26"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b2c"/>
      <stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#ff7a36" stroke-width="1.8"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #8da0b5; }
      .line { stroke: #304052; }
      .orange { fill: #ff7a36; }
      .cyan { fill: #6dd6d1; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#3a4a5a" stroke-width="2"/>
  <path d="M34 74H1166M34 338H1166" class="line" stroke-width="2"/>

  <text x="36" y="42" class="mono" font-size="16" letter-spacing="3" fill="#c7d4e2">YUMEKAZ / PROFILE.CONSOLE</text>
  <circle cx="1010" cy="36" r="6" fill="#6dd6d1" filter="url(#glow)"/>
  <text x="1028" y="42" class="mono" font-size="14" letter-spacing="2" fill="#6dd6d1">SYSTEMS ONLINE</text>

  <text x="42" y="132" class="mono" font-size="15" letter-spacing="3" fill="#ff7a36">LANE: DISTRIBUTED_BACKEND</text>
  <text x="40" y="188" class="sans" font-size="48" font-weight="750" letter-spacing="1" fill="#f2f6fa">REPLICATION.</text>
  <text x="40" y="241" class="sans" font-size="48" font-weight="750" letter-spacing="1" fill="#f2f6fa">CONSISTENCY.</text>
  <text x="40" y="294" class="sans" font-size="48" font-weight="750" letter-spacing="1" fill="url(#orange)">RECOVERY.</text>

  <text x="625" y="116" class="mono" font-size="13" letter-spacing="2" fill="#8da0b5">CONTROL PLANE / REPLICATION VIEW</text>
  <rect x="630" y="138" width="500" height="158" rx="10" fill="#0a1016" stroke="#304052"/>
  <path d="M857 176L731 214M903 176L1023 214M880 183V228" stroke="#ff7a36" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <circle cx="880" cy="158" r="24" fill="#ff7a36"/>
  <circle cx="880" cy="158" r="17" fill="#121c27"/>
  <circle cx="710" cy="225" r="19" fill="#121c27" stroke="#6dd6d1" stroke-width="2"/>
  <circle cx="880" cy="248" r="19" fill="#121c27" stroke="#6dd6d1" stroke-width="2"/>
  <circle cx="1044" cy="225" r="19" fill="#121c27" stroke="#6dd6d1" stroke-width="2"/>
  <text x="880" y="163" text-anchor="middle" class="mono" font-size="10" fill="#f2f6fa">LDR</text>
  <text x="710" y="230" text-anchor="middle" class="mono" font-size="10" fill="#6dd6d1">F1</text>
  <text x="880" y="253" text-anchor="middle" class="mono" font-size="10" fill="#6dd6d1">F2</text>
  <text x="1044" y="230" text-anchor="middle" class="mono" font-size="10" fill="#6dd6d1">F3</text>
  <text x="880" y="283" text-anchor="middle" class="mono" font-size="10" fill="#8da0b5">QUORUM / CAUSAL HISTORY</text>

  <g class="mono" font-size="13">
    <text x="42" y="376" fill="#8da0b5">306 TESTS</text>
    <text x="270" y="376" fill="#8da0b5">23 → 0 RYW</text>
    <text x="510" y="376" fill="#8da0b5">15 FAULT TYPES</text>
    <text x="810" y="376" fill="#8da0b5">281 ORACLE CHECKS</text>
  </g>
  <path d="M42 392H1158" stroke="#ff7a36" stroke-width="3"/>
  <text x="42" y="414" class="mono" font-size="12" letter-spacing="2" fill="#6dd6d1">DEFINE THE GUARANTEE · BREAK THE SYSTEM · PRESERVE THE EVIDENCE</text>
</svg>
